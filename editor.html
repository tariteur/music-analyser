<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Music Analyser - Mode Prestation</title>
  
  <!-- CodeMirror CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/comment/comment.min.js"></script>

  <style>
    :root {
      --bg: #070707;
      --panel: #0f0f0f;
      --panel-2: #000000;
      --border: #222;
      --text: #dddddd;
      --muted: #777;
      --accent: #00ff88;
      --danger: #ff3b3b;
      --midi: #55aaff;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      overflow: hidden;
    }

    /* CSS GESTION DES VUES (MODIFICATION / PRESTATION) */
    .perf-mode .hide-in-perf {
      display: none !important;
    }
    .perf-mode #api-sidebar,
    .perf-mode #editorContainer {
      display: none !important;
    }

    #header {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-sizing: border-box;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      border-radius: 3px;
    }

    .btn-run {
      background: var(--accent);
      color: #000;
    }

    .btn-edit {
      background: var(--danger);
      color: #fff;
    }

    .btn-dark {
      background: #222;
      color: #aaa;
    }

    .btn-midi {
      background: #1f2b3a;
      color: #9fd2ff;
    }

    #midiTesterContainer {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    #midiTesterContainer label {
      font-size: 10px;
      color: var(--muted);
      font-family: monospace;
    }

    #midiTesterContainer input {
      width: 42px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: var(--midi);
      padding: 3px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      text-align: center;
    }

    #midiTesterContainer input::-webkit-inner-spin-button,
    #midiTesterContainer input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #api-sidebar {
      width: 250px;
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #perf-sidebar {
      width: 240px;
      background: #0a0a0a;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .api-header {
      padding: 10px;
      font-size: 12px;
      background: #111;
      color: #aaa;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: bold;
    }

    .api-category {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .api-category-title {
      padding: 8px 10px;
      font-size: 11px;
      font-weight: bold;
      background: #1a1a1a;
      color: var(--text);
      text-transform: uppercase;
      border-bottom: 1px solid #222;
      border-top: 1px solid #222;
    }

    .api-item {
      padding: 6px 10px 6px 20px;
      font-size: 11px;
      font-family: monospace;
      color: var(--accent);
      cursor: pointer;
      border-bottom: 1px solid #111;
      transition: background 0.2s;
    }

    .api-item:hover {
      background: #222;
    }

    .api-item-desc {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-family: Inter, sans-serif;
      margin-top: 2px;
    }

    #editorContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .CodeMirror {
      flex: 1;
      height: 100%;
      font-size: 14px;
      font-family: 'Fira Code', monospace;
    }

    #console {
      width: 320px;
      background: var(--panel-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 280px;
    }

    #logHeader {
      padding: 8px 10px;
      font-size: 11px;
      background: #111;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: #666;
      flex-shrink: 0;
    }

    #logContent {
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      padding: 8px 10px;
      color: var(--accent);
    }

    .log-line {
      padding: 2px 0;
      border-bottom: 1px solid #111;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #stats {
      margin-left: auto;
      font-family: monospace;
      font-size: 11px;
      color: #666;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .beat {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
      display: inline-block;
    }

    .beat.active {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    #midiStatus {
      color: var(--midi);
      font-family: monospace;
      font-size: 11px;
    }

    input[type="file"] {
      display: none;
    }

    .toast-banner {
      display: none;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #1a1a1a;
      border: 1px solid #ffcc00;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }

    .toast-banner.active {
      display: flex;
    }

    .switch-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #1a1a1a;
      background: #0f0f0f;
    }

    .switch-label {
      font-size: 12px;
      color: #eee;
      font-family: sans-serif;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #aaa;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      background-color: #000;
      transform: translateX(16px);
    }
  </style>
</head>

<!-- Ajout de la classe perf-mode par défaut -->
<body class="perf-mode">

<div id="header">
  <button class="btn btn-edit" id="toggleViewBtn">VUE MODIFICATION</button>
  <button class="btn btn-dark" id="openBPM-ViwerBtn">BPM-VIEWER</button>
  <button class="btn btn-run" id="runBtn">RUN</button>
  <button class="btn btn-dark hide-in-perf" id="exportBtn">EXPORT</button>
  <button class="btn btn-dark hide-in-perf" id="importBtn">IMPORT</button>
  <button class="btn btn-dark hide-in-perf" onclick="clearLogs()">CLEAR</button>

  <div id="midiTesterContainer" class="hide-in-perf">
    <label for="midiTestNote">NOTE</label>
    <input type="number" id="midiTestNote" value="60" min="0" max="127" />
    <label for="midiTestVel">VAL</label>
    <input type="number" id="midiTestVel" value="100" min="0" max="127" />
    <button class="btn btn-midi" id="sendMidiTestBtn" style="padding: 4px 8px; font-size: 11px;">TESTER</button>
  </div>

  <div id="stats">
    <span id="bpm">BPM: --</span>
    <span id="midiStatus">MIDI: OFF</span>
    <div class="beat" id="beat"></div>
  </div>

  <input type="file" id="fileInput" accept=".analyser" />
</div>

<div id="main">
  <!-- Barre latérale d'API -->
  <div id="api-sidebar">
    <div class="api-header">API & Snippets (Clic pour insérer)</div>
    
    <div class="api-category-title" style="color: #ffaa00;">Prestation</div>
    <ul class="api-category" id="apiPrestation"></ul>

    <div class="api-category-title" style="color: #6b2dbf;">Audio</div>
    <ul class="api-category" id="apiAudio"></ul>

    <div class="api-category-title" style="color: #55aaff;">MIDI</div>
    <ul class="api-category" id="apiMidi"></ul>

    <div class="api-category-title" style="color: #ff3b3b;">Actions & Contrôle</div>
    <ul class="api-category" id="apiActions"></ul>
  </div>

  <!-- Éditeur de code -->
  <div id="editorContainer">
    <textarea id="codeEditor"></textarea>
  </div>

  <!-- Panneau Prestation pour les Switches -->
  <div id="perf-sidebar">
    <div class="api-header" style="color: var(--accent);">MODE PRESTATION</div>
    <div id="switchesContainer">
      <!-- Les switchs générés par le code apparaitront ici -->
    </div>
  </div>

  <!-- Console -->
  <div id="console">
    <div id="logHeader">
      <span>CONSOLE INTÉGRÉE</span>
      <span id="count">0</span>
    </div>
    <div id="logContent"></div>
  </div>
</div>

<div id="popupModal" class="toast-banner">
  <span>⚠️ Code modifié pendant l'exécution</span>
  <button class="btn btn-run" id="popupRestartBtn" style="padding: 3px 8px; font-size: 11px;">RELANCER</button>
  <button class="btn btn-dark" id="popupCloseBtn" style="padding: 2px 6px; font-size: 11px;">✕</button>
</div>

<!-- CODE PAR DÉFAUT -->
<script type="text/plain" id="defaultCode">
</script>

<script src="./settings.js"></script>
<script type="module">
import AudioAPI from "./audio/AudioAPI.js";

let isRunning = false;
let hasWarnedModified = false;
let isHardwareInit = false; // Permet de savoir si l'audio et le midi ont été initialisés

// Logique pour basculer entre mode Prestation et mode Modification
const toggleViewBtn = document.getElementById("toggleViewBtn");
toggleViewBtn.onclick = () => {
  document.body.classList.toggle("perf-mode");
  if (document.body.classList.contains("perf-mode")) {
    toggleViewBtn.innerText = "VUE MODIFICATION";
    toggleViewBtn.className = "btn btn-edit";
  } else {
    toggleViewBtn.innerText = "MODE PRESTATION";
    toggleViewBtn.className = "btn btn-run";
    // Rafraîchir l'éditeur CodeMirror pour éviter les bugs d'affichage
    setTimeout(() => editor.refresh(), 10);
  }
};

/* =========================
   GESTION DES SWITCHES (PRESTATION)
   ========================= */
window.switchStates = {};
window.registeredSwitches = new Set();

function clearSwitchesUI() {
  document.getElementById("switchesContainer").innerHTML = "";
  window.registeredSwitches.clear();
}

function getSwitch(name, defaultVal = true) {
  if (!window.registeredSwitches.has(name)) {
    window.registeredSwitches.add(name);

    if (window.switchStates[name] === undefined) {
      window.switchStates[name] = defaultVal;
    }

    const container = document.getElementById("switchesContainer");
    const div = document.createElement("div");
    div.className = "switch-item";

    const label = document.createElement("div");
    label.className = "switch-label";
    label.textContent = name;

    const labelSwitch = document.createElement("label");
    labelSwitch.className = "switch";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = window.switchStates[name];
    input.onchange = (e) => {
      window.switchStates[name] = e.target.checked;
    };

    const span = document.createElement("span");
    span.className = "slider";

    labelSwitch.appendChild(input);
    labelSwitch.appendChild(span);
    div.appendChild(label);
    div.appendChild(labelSwitch);
    container.appendChild(div);
  }
  return window.switchStates[name];
}

/* =========================
   INITIALISATION DE L'ÉDITEUR
   ========================= */
const editorTextArea = document.getElementById("codeEditor");
const editor = CodeMirror.fromTextArea(editorTextArea, {
  mode: "javascript",
  theme: "monokai",
  lineNumbers: true,
  matchBrackets: true,
  autoCloseBrackets: true,
  indentUnit: 2,
  tabSize: 2,
  extraKeys: {
    "Ctrl-/": "toggleComment",
    "Cmd-/": "toggleComment"
  }
});

const DEFAULT_CODE = document.getElementById("defaultCode").textContent.trim();

const apiSnippets = {
  prestation: [
    { code: 'getSwitch("Nom du Switch", true)', desc: "Crée un bouton UI dynamique" },
    { code: 'if (getSwitch("BPM", true)) {\n  // Code\n}', desc: "Condition d'exécution (On/Off)" }
  ],
  audio: [
    { code: "audio.bpm", desc: "Valeur actuelle du BPM" },
    { code: "audio.dropRatio", desc: "Énergie / Drop ratio" },
    { code: "audio.rms", desc: "Volume RMS" },
    { code: "audio.beat", desc: "Booléen: true si sur un beat" },
    { code: "audio.theme", desc: "Thème actuel (ex: 'Rock')" },
    { code: "audio.primaryColor", desc: "couleur primaire" },
    { code: "audio.secondaryColor", desc: "couleur secondaire" }
  ],
  midi: [
    { code: "midi.lastNote", desc: "Dernière note MIDI reçue" },
    { code: "midi.lastVelocity", desc: "Dernière vélocité reçue" }
  ],
  actions: [
    { code: "while (isRunning()) {\n  await sleep(50);\n}", desc: "Boucle principale" },
    { code: "await sleep(100);", desc: "Pause l'exécution (en ms)" },
    { code: "sendMidiNote(60, 100, 1);", desc: "Envoyer note(note, vel, ch)" },
    { code: "printToConsole('Message');", desc: "Afficher dans la console" }
  ]
};

function buildSidebar() {
  const insertSnippet = (code) => {
    const doc = editor.getDoc();
    const cursor = doc.getCursor();
    doc.replaceRange(code, cursor);
    editor.focus();
  };

  const createItems = (list, containerId) => {
    const container = document.getElementById(containerId);
    list.forEach(item => {
      const li = document.createElement("li");
      li.className = "api-item";
      li.innerHTML = `<div>${item.code}</div><span class="api-item-desc">${item.desc}</span>`;
      li.onclick = () => insertSnippet(item.code);
      container.appendChild(li);
    });
  };

  createItems(apiSnippets.prestation, "apiPrestation");
  createItems(apiSnippets.audio, "apiAudio");
  createItems(apiSnippets.midi, "apiMidi");
  createItems(apiSnippets.actions, "apiActions");
}
buildSidebar();

const popupModal = document.getElementById("popupModal");
function showPopup() { popupModal.classList.add("active"); }
function hidePopup() { popupModal.classList.remove("active"); }

document.getElementById("popupCloseBtn").onclick = hidePopup;
document.getElementById("popupRestartBtn").onclick = () => {
  hidePopup();
  restartScript();
};

const SAVE_KEY = "js_project_v3_perf";

function saveWorkspace() {
  localStorage.setItem(SAVE_KEY, editor.getValue());
}

function loadWorkspace() {
  const code = localStorage.getItem(SAVE_KEY);
  if (code) editor.setValue(code);
  else editor.setValue(DEFAULT_CODE);
}

editor.on("change", () => {
  saveWorkspace();
  if (isRunning && !hasWarnedModified) {
    hasWarnedModified = true;
    showPopup();
  }
});

loadWorkspace();

/* =========================
   DONNÉES AUDIO / MIDI
   ========================= */
const audio = new AudioAPI({
  onFrame: (s) => {
    audioData.bpm = Number(s?.bpm) || 0;
    audioData.dropRatio = Number(s?.dropRatio) || 0;
    audioData.rms = Number(s?.state?.dropRatio ?? s?.state?.rms ?? s?.rms ?? s?.dropRatio ?? 0) || 0;
    audioData.beat = !!s?.beat; audioData.theme = String(s?.theme || "Rock");
    if (s?.primaryColor) audioData.primaryColor = { ...s.primaryColor };
    if (s?.secondaryColor) audioData.secondaryColor = { ...s.secondaryColor };

    document.getElementById("bpm").innerText = `BPM: ${Math.round(audioData.bpm)}`;
    document.getElementById("beat").classList.toggle("active", audioData.beat);
  }
});

let audioData = { bpm: 0, dropRatio: 0, rms: 0, beat: false, theme: "Rock", primaryColor: { hex: "#334155", name: "Aucune" }, secondaryColor: { hex: "#334155", name: "Aucune" }, notes: [] };
let midiData = { connected: false, lastNote: -1, lastVelocity: 0, lastChannel: 0, lastEvent: "", activeNotes: Array(128).fill(false) };
let midiAccess = null; let midiOutput = null;

function updateMidiStatus() { document.getElementById("midiStatus").innerText = midiData.connected ? "MIDI: ON" : "MIDI: OFF"; }

function bindMidiInputs() {
  if (!midiAccess) return;
  midiAccess.inputs.forEach((input) => { input.onmidimessage = handleMidiMessage; });
}

function handleMidiMessage(event) {
  const data = event.data || [];
  const status = data[0] ?? 0; const note = data[1] ?? 0; const velocity = data[2] ?? 0;
  const type = status & 0xF0; const channel = (status & 0x0F) + 1;
  midiData.lastChannel = channel; midiData.lastNote = note; midiData.lastVelocity = velocity;
  if (type === 0x90 && velocity > 0) { midiData.lastEvent = "noteon"; midiData.activeNotes[note] = true; } 
  else if (type === 0x80 || (type === 0x90 && velocity === 0)) { midiData.lastEvent = "noteoff"; midiData.activeNotes[note] = false; } 
  else { midiData.lastEvent = "other"; }
}

async function initMidi() {
  if (!navigator.requestMIDIAccess) { printToConsole("Web MIDI non supporté"); return; }
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    midiData.connected = true;
    const outputs = Array.from(midiAccess.outputs.values());
    midiOutput = outputs[0] || null;
    bindMidiInputs();
    midiAccess.onstatechange = () => { bindMidiInputs(); midiOutput = Array.from(midiAccess.outputs.values())[0] || null; };
    updateMidiStatus();
  } catch (e) { midiData.connected = false; updateMidiStatus(); printToConsole("Impossible d'activer MIDI."); }
}

const lastSendTimeByNote = new Array(128).fill(0);
function sendMidiNote(note, velocity = 100, channel = 1) {
  if (!midiOutput) return;
  const n = Math.max(0, Math.min(127, Number(note) || 0));
  const v = Math.max(0, Math.min(127, Number(velocity) || 0));
  const ch = Math.max(1, Math.min(16, Number(channel) || 1)) - 1;
  const currentTime = performance.now();
  if (currentTime - lastSendTimeByNote[n] < 33.33) return;
  midiOutput.send([0x90 | ch, n, v]);
  lastSendTimeByNote[n] = currentTime;
}

document.getElementById("sendMidiTestBtn").onclick = () => {
  const noteVal = parseInt(document.getElementById("midiTestNote").value, 10) || 0;
  const velVal = parseInt(document.getElementById("midiTestVel").value, 10) || 0;
  sendMidiNote(noteVal, velVal);
  printToConsole(`[TEST MIDI] Note: ${noteVal} | Val: ${velVal}`);
};

/* =========================
   CONSOLE
   ========================= */
const logContainer = document.getElementById("logContent");
const countEl = document.getElementById("count");
let lineCount = 0;

window.printToConsole = (msg) => {
  const div = document.createElement("div");
  div.className = "log-line";
  let text = typeof msg === "object" ? JSON.stringify(msg) : String(msg);
  div.textContent = `[${new Date().toLocaleTimeString()}] > ${text}`;
  logContainer.prepend(div);
  lineCount++;
  if (lineCount > 1000) { logContainer.removeChild(logContainer.lastChild); lineCount--; }
  countEl.innerText = `${lineCount}`;
};

window.clearLogs = () => { logContainer.innerHTML = ""; lineCount = 0; countEl.innerText = "0"; };

/* =========================
   MOTEUR D'EXÉCUTION
   ========================= */
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
const isRunningCheck = () => isRunning;
const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;

function startScript() {
  isRunning = true;
  hasWarnedModified = false;
  document.getElementById("runBtn").innerText = "STOP";
  document.getElementById("runBtn").className = "btn btn-edit";

  clearSwitchesUI();

  try {
    const code = editor.getValue();
    const compiledFn = new AsyncFunction("audio", "midi", "printToConsole", "sendMidiNote", "sleep", "isRunning", "getSwitch", code);
    compiledFn(audioData, midiData, window.printToConsole, sendMidiNote, sleep, isRunningCheck, getSwitch).catch(e => {
      printToConsole("ERREUR : " + e.message); stopScript();
    });
  } catch (e) {
    alert("Erreur de Syntaxe: " + e.message); stopScript();
  }
}

function stopScript() {
  isRunning = false;
  hasWarnedModified = false;
  hidePopup();
  document.getElementById("runBtn").innerText = "RUN";
  document.getElementById("runBtn").className = "btn btn-run";
}

function restartScript() {
  stopScript();
  setTimeout(() => { startScript(); }, 50);
}

// Lancement combiné Audio + Midi + Script
document.getElementById("runBtn").onclick = async () => { 
  if (isRunning) {
    stopScript(); 
  } else { 
    if (!isHardwareInit) {
      audio.start();
      await initMidi();
      isHardwareInit = true;
    }
    startScript(); 
  }
};

/* =========================
   EXPORT / IMPORT / EXTRAS
   ========================= */
document.getElementById("exportBtn").onclick = () => {
  const code = editor.getValue();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([code], { type: "text/plain" }));
  a.download = "script.analyser"; a.click();
};

const fileInput = document.getElementById("fileInput");
document.getElementById("importBtn").onclick = () => { fileInput.click(); };
fileInput.onchange = () => {
  const file = fileInput.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { editor.setValue(reader.result); saveWorkspace(); };
  reader.readAsText(file); fileInput.value = "";
};

window.addEventListener("DOMContentLoaded", function () {
  document.getElementById("openBPM-ViwerBtn").onclick = function () {
    if (window.electronAPI && window.electronAPI.openTest) window.electronAPI.openTest();
  };
});
updateMidiStatus();
</script>

</body>
</html>
