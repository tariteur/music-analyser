<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Music Analyser</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>

  <style>
    :root {
      --bg: #070707;
      --panel: #0f0f0f;
      --panel-2: #000000;
      --border: #222;
      --text: #dddddd;
      --muted: #777;
      --accent: #00ff88;
      --danger: #ff3b3b;
      --midi: #55aaff;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      overflow: hidden;
    }

    #header {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-sizing: border-box;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      border-radius: 3px;
    }

    .btn-run {
      background: var(--accent);
      color: #000;
    }

    .btn-edit {
      background: var(--danger);
      color: #fff;
    }

    .btn-dark {
      background: #222;
      color: #aaa;
    }

    .btn-midi {
      background: #1f2b3a;
      color: #9fd2ff;
    }

    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #blocklyDiv {
      flex: 1;
    }

    #console {
      width: 380px;
      background: var(--panel-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 280px;
    }

    #logHeader {
      padding: 8px 10px;
      font-size: 11px;
      background: #111;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: #666;
      flex-shrink: 0;
    }

    #logContent {
      flex: 1;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      padding: 8px 10px;
      color: var(--accent);
    }

    .log-line {
      padding: 2px 0;
      border-bottom: 1px solid #111;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mode-run .blocklyToolboxDiv {
      display: none !important;
    }

    #stats {
      margin-left: auto;
      font-family: monospace;
      font-size: 11px;
      color: #666;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .beat {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
      display: inline-block;
    }

    .beat.active {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    #midiStatus {
      color: var(--midi);
      font-family: monospace;
      font-size: 11px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<div id="header">
  <button class="btn btn-dark" id="openBPM-ViwerBtn">BPM-Viwer</button>
  <button class="btn btn-dark" id="audioBtn">AUDIO</button>
  <button class="btn btn-midi" id="midiBtn">MIDI</button>
  <button class="btn btn-run" id="runBtn">RUN</button>
  <button class="btn btn-dark" id="exportBtn">EXPORT</button>

  </div>

<script src="./settings.js"></script>
<script type="module">
import AudioAPI from "./audio/AudioAPI.js";

const jsGen = Blockly.JavaScript;

/* =========================
   CONFIG DU BLOC TEMPORISÉ
   ========================= */
const TIMED_CONDITION_FEATURES = {
  bool: true,
  gt: true,
  gte: true,
  lt: true,
  lte: true,
  eq: true,
  timeToggle: true,
  rangeMode: true
};

function buildOperatorItems() {
  return [
    TIMED_CONDITION_FEATURES.bool ? ["TRUE / FALSE", "BOOL"] : null,
    TIMED_CONDITION_FEATURES.gt ? [">", ">"] : null,
    TIMED_CONDITION_FEATURES.gte ? [">=", ">="] : null,
    TIMED_CONDITION_FEATURES.lt ? ["<", "<"] : null,
    TIMED_CONDITION_FEATURES.lte ? ["<=", "<="] : null,
    TIMED_CONDITION_FEATURES.eq ? ["=", "=="] : null
  ].filter(Boolean);
}

/* =========================
   DONNÉES AUDIO
   ========================= */
let audioData = {
  bpm: 0,
  dropRatio: 0,
  rms: 0,
  beat: false,
  theme: "Rock",
  notes: [
    { active: false, value: 0 },
    { active: false, value: 0 },
    { active: false, value: 0 }
  ]
};

function normalizeNotes(state) {
  const out = [
    { active: false, value: 0 },
    { active: false, value: 0 },
    { active: false, value: 0 }
  ];

  const notes = Array.isArray(state?.notes) ? state.notes : [];

  for (let i = 0; i < 3; i++) {
    const n = notes[i] || {};
    const value = Number(
      n.value ??
      n.note ??
      n.midi ??
      n.pitch ??
      n.num ??
      0
    ) || 0;

    out[i] = {
      active: !!n.active,
      value
    };
  }

  return out;
}

/* =========================
   DONNÉES MIDI
   ========================= */
let midiData = {
  connected: false,
  lastNote: -1,
  lastVelocity: 0,
  lastChannel: 0,
  lastEvent: "",
  activeNotes: Array(128).fill(false)
};

let midiAccess = null;
let midiOutput = null;

function updateMidiStatus() {
  const el = document.getElementById("midiStatus");
  el.innerText = midiData.connected ? "MIDI: ON" : "MIDI: OFF";
}

function bindMidiInputs() {
  if (!midiAccess) return;

  midiAccess.inputs.forEach((input) => {
    input.onmidimessage = handleMidiMessage;
  });
}

function handleMidiMessage(event) {
  const data = event.data || [];
  const status = data[0] ?? 0;
  const note = data[1] ?? 0;
  const velocity = data[2] ?? 0;

  const type = status & 0xF0;
  const channel = (status & 0x0F) + 1;

  midiData.lastChannel = channel;
  midiData.lastNote = note;
  midiData.lastVelocity = velocity;

  if (type === 0x90 && velocity > 0) {
    midiData.lastEvent = "noteon";
    midiData.activeNotes[note] = true;
  } else if (type === 0x80 || (type === 0x90 && velocity === 0)) {
    midiData.lastEvent = "noteoff";
    midiData.activeNotes[note] = false;
  } else {
    midiData.lastEvent = "other";
  }
}

async function initMidi() {
  if (!navigator.requestMIDIAccess) {
    alert("Web MIDI non supporté dans ce navigateur.");
    return;
  }

  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
    midiData.connected = true;

    const outputs = Array.from(midiAccess.outputs.values());
    midiOutput = outputs[0] || null;

    bindMidiInputs();

    midiAccess.onstatechange = () => {
      bindMidiInputs();
      const outputs = Array.from(midiAccess.outputs.values());
      midiOutput = outputs[0] || null;
    };

    updateMidiStatus();
  } catch (e) {
    midiData.connected = false;
    updateMidiStatus();
    alert("Impossible d'activer MIDI.");
  }
}

// Tableaux pour suivre l'état de chaque note MIDI (0 à 127)
const lastSendTimeByNote = new Array(128).fill(0);

function sendMidiNote(note, velocity = 100, channel = 1) {
  if (!midiOutput) {
    printToConsole("MIDI output indisponible");
    return;
  }

  // Sécurisation des paramètres
  const n = Math.max(0, Math.min(127, Number(note) || 0));
  const v = Math.max(0, Math.min(127, Number(velocity) || 0));
  const ch = Math.max(1, Math.min(16, Number(channel) || 1)) - 1;

  const currentTime = performance.now();

  // 1. Limiteur 30 Hz : Si l'appel est trop rapproché du dernier ENVOI (~33.33ms)
  if (currentTime - lastSendTimeByNote[n] < 33.33) {
    return; // On ignore le spam trop rapide
  }

  // 2. Envoi de la nouvelle valeur (Note On uniquement, pas de Note Off)
  midiOutput.send([0x90 | ch, n, v]);
  lastSendTimeByNote[n] = currentTime;
}

/* =========================
   BLOCS AUDIO
   ========================= */

Blockly.Blocks['get_bpm'] = {

/* Moyenne glissante persistante sur N echantillons (buffer circulaire stocke
   dans persistentStore, indexe par l'id du bloc — survit entre les frames) */
Blockly.Blocks['rolling_average'] = {
  init: function() {
    this.appendValueInput("VALUE").setCheck("Number").appendField("MOYENNE DE");
    this.appendValueInput("SIZE").setCheck("Number").appendField("SUR");
    this.appendDummyInput().appendField("ÉLÉMENTS");
    this.setInputsInline(true);
    this.setOutput(true, "Number");
    this.setStyle('audio_style');
    this.setTooltip("Moyenne glissante de la valeur sur les N derniers passages (persiste entre les frames).");
  }
};
jsGen.forBlock['rolling_average'] = (block, generator) => {
  const valCode = generator.valueToCode(block, "VALUE", jsGen.ORDER_NONE) || "0";
  const sizeCode = generator.valueToCode(block, "SIZE", jsGen.ORDER_NONE) || "1";
  const key = JSON.stringify("rollavg_" + block.id);
  return [`
(() => {
  const key = ${key};
  const v = Number(${valCode}) || 0;
  let n = Math.max(1, Math.floor(Number(${sizeCode}) || 1));
  let st = persistentStore.get(key);
  if (!st) { st = { buf: [], sum: 0, i: 0 }; persistentStore.set(key, st); }
  // ajuste la taille si N a change
  while (st.buf.length > n) { st.sum -= st.buf.shift(); if (st.i > st.buf.length) st.i = st.buf.length; }
  if (st.buf.length < n) {
    st.buf.push(v); st.sum += v;
  } else {
    st.sum -= st.buf[st.i]; st.buf[st.i] = v; st.sum += v;
    st.i = (st.i + 1) % n;
  }
  return st.sum / st.buf.length;
})()
`, jsGen.ORDER_ATOMIC];
};

jsGen.forBlock['get_note_2_value'] = () => ['audio.notes[1] ? audio.notes[1].value : 0', jsGen.ORDER_ATOMIC];

   BLOCS MIDI

};

jsGen.forBlock['midi_send_note'] = (block, generator) => {

};

/* =========================
   BLOC TEMPORISÉ DYNAMIQUE
   ========================= */

Blockly.Blocks['timed_condition'] = {
  init: function() {
    this.appendValueInput("VAR")
      .appendField("SI");

    this.appendDummyInput("OP_INPUT")
      .appendField(new Blockly.FieldDropdown(buildOperatorItems()), "OP");

    if (TIMED_CONDITION_FEATURES.timeToggle) {
      this.appendDummyInput("TIME_TOGGLE_INPUT")
        .appendField("TEMPS")
        .appendField(new Blockly.FieldCheckbox("TRUE"), "USE_TIME");
    }

    if (TIMED_CONDITION_FEATURES.rangeMode) {
      this.appendDummyInput("TIME_MODE_INPUT")
        .appendField(new Blockly.FieldDropdown([
          ["FIXE", "FIXED"],
          ["MIN / MAX", "RANGE"]
        ]), "TIME_MODE");
    }

    this.appendValueInput("THRESHOLD")
      .setCheck("Number")
      .appendField("SEUIL");

    this.appendValueInput("TIME")
      .setCheck("Number")
      .appendField("DURÉE");

    this.appendValueInput("MIN_TIME")
      .setCheck("Number")
      .appendField("MIN");

    this.appendValueInput("MAX_TIME")
      .setCheck("Number")
      .appendField("MAX");

    this.setOutput(true, "Boolean");
    this.setStyle('condition_style');
    this.setTooltip("Retourne vrai si la condition reste vraie pendant la durée demandée.");
    this.setHelpUrl("");

    this.updateShape_ = () => {
      const op = this.getFieldValue("OP");
      const useTime = TIMED_CONDITION_FEATURES.timeToggle
        ? (this.getFieldValue("USE_TIME") === "TRUE")
        : true;
      const timeMode = TIMED_CONDITION_FEATURES.rangeMode
        ? (this.getFieldValue("TIME_MODE") || "FIXED")
        : "FIXED";

      const thresholdInput = this.getInput("THRESHOLD");
      if (thresholdInput) {
        thresholdInput.setVisible(op !== "BOOL");
      }

      const timeInput = this.getInput("TIME");
      const minInput = this.getInput("MIN_TIME");
      const maxInput = this.getInput("MAX_TIME");

      if (timeInput) timeInput.setVisible(useTime && timeMode === "FIXED");
      if (minInput) minInput.setVisible(useTime && timeMode === "RANGE");
      if (maxInput) maxInput.setVisible(useTime && timeMode === "RANGE");

      if (this.rendered) {
        this.render();
      }
    };

    this.setOnChange((event) => {
      if (event && event.isUiEvent) return;
      this.updateShape_();
    });

    this.updateShape_();
  }
};

jsGen.forBlock['timed_condition'] = (block, generator) => {
  const varCode = generator.valueToCode(block, "VAR", jsGen.ORDER_NONE) || "false";
  const thresholdCode = generator.valueToCode(block, "THRESHOLD", jsGen.ORDER_NONE) || "0";
  const op = block.getFieldValue("OP");

  const useTime = TIMED_CONDITION_FEATURES.timeToggle
    ? (block.getFieldValue("USE_TIME") === "TRUE")
    : true;

  const timeMode = TIMED_CONDITION_FEATURES.rangeMode
    ? (block.getFieldValue("TIME_MODE") || "FIXED")
    : "FIXED";

  const timeCode = generator.valueToCode(block, "TIME", jsGen.ORDER_NONE) || "0";
  const minTimeCode = generator.valueToCode(block, "MIN_TIME", jsGen.ORDER_NONE) || "0";
  const maxTimeCode = generator.valueToCode(block, "MAX_TIME", jsGen.ORDER_NONE) || "0";

  const key = JSON.stringify(block.id);

  const conditionExpr = op === "BOOL"
    ? `(!!(${varCode}))`
    : `((${varCode}) ${op} (${thresholdCode}))`;

  return [`
(() => {
  const now = performance.now();
  const key = ${key};
  const isTrue = ${conditionExpr};

  if (!isTrue) {
    conditionState.delete(key);
    return false;
  }

  if (!${useTime}) {
    return true;
  }

  if (!conditionState.has(key)) {
    conditionState.set(key, now);
    return false;
  }

  const start = conditionState.get(key);
  const elapsed = now - start;

  if (${JSON.stringify(timeMode)} === "FIXED") {
    return elapsed >= Number(${timeCode});
  }

  const minT = Number(${minTimeCode});
  const maxT = Number(${maxTimeCode});
  return elapsed >= minT && elapsed <= maxT;
})()
`, jsGen.ORDER_ATOMIC];
};

/* =========================
   CONSOLE INTÉGRÉE
   ========================= */

const logContainer = document.getElementById("logContent");
const countEl = document.getElementById("count");
let lineCount = 0;

window.printToConsole = (msg) => {
  const div = document.createElement("div");
  div.className = "log-line";

  let text = msg;
  if (typeof msg === "boolean") text = msg ? "TRUE (Vrai)" : "FALSE (Faux)";
  if (typeof msg === "object") {
    try {
      text = JSON.stringify(msg, null, 2);
    } catch {
      text = String(msg);
    }
  }

  div.textContent = `[${new Date().toLocaleTimeString()}] > ${text}`;
  logContainer.prepend(div);
  lineCount++;

  if (lineCount > 1000) {
    logContainer.removeChild(logContainer.lastChild);
    lineCount--;
  }

  countEl.innerText = `${lineCount}`;
};

window.clearLogs = () => {
  logContainer.innerHTML = "";
  lineCount = 0;
  countEl.innerText = "0";
};

/* =========================
   SAUVEGARDE AUTOMATIQUE
   ========================= */

const SAVE_KEY = "block_project_v9_dark";

function saveWorkspace() {
  const data = Blockly.serialization.workspaces.save(workspace);
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadWorkspace() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;

  try {
    const data = JSON.parse(raw);
    workspace.clear();
    Blockly.serialization.workspaces.load(data, workspace);
  } catch (e) {
    console.warn("Impossible de charger la sauvegarde :", e);
  }
}

workspace.addChangeListener((event) => {
  if (!event.isUiEvent) {
    saveWorkspace();
  }
});

loadWorkspace();

/* =========================
   RUN
   ========================= */

let isRunning = false;
let compiledFn = null;
const conditionState = new Map();
const persistentStore = new Map();

document.getElementById("runBtn").onclick = () => {
  isRunning = !isRunning;

  if (isRunning) {
    try {
      const code = jsGen.workspaceToCode(workspace);
      compiledFn = new Function("audio", "midi", "printToConsole", "conditionState", "sendMidiNote", "persistentStore", code);

      document.body.classList.add("mode-run");
      document.getElementById("runBtn").innerText = "EDIT";
      document.getElementById("runBtn").className = "btn btn-edit";
    } catch (e) {
      alert("Erreur Blockly: " + e.message);
      isRunning = false;
    }
  } else {
    document.body.classList.remove("mode-run");
    document.getElementById("runBtn").innerText = "RUN";
    document.getElementById("runBtn").className = "btn btn-run";
  }
};

/* =========================
   AUDIO
   ========================= */

const audio = new AudioAPI({
  onFrame: (s) => {
    audioData.bpm = Number(s?.bpm) || 0;
    audioData.dropRatio = Number(s?.dropRatio) || 0;

    audioData.rms = Number(
      s?.state?.dropRatio ??
      s?.state?.rms ??
      s?.rms ??
      s?.dropRatio ??
      0
    ) || 0;

    audioData.beat = !!s?.beat;
    audioData.theme = String(s?.theme || "Rock");
    audioData.notes = normalizeNotes(s);

    document.getElementById("bpm").innerText = `BPM: ${Math.round(audioData.bpm)}`;
    document.getElementById("beat").classList.toggle("active", audioData.beat);

    if (isRunning && compiledFn) {
      try {
        compiledFn(audioData, midiData, window.printToConsole, conditionState, sendMidiNote, persistentStore);
      } catch (e) {
        console.error(e);
      }
    }
  }
});

document.getElementById("audioBtn").onclick = () => {
  audio.start();
};

/* =========================
   EXPORT / IMPORT
   ========================= */

document.getElementById("exportBtn").onclick = () => {
  const data = Blockly.serialization.workspaces.save(workspace);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "project-blockly.json";
  a.click();

  URL.revokeObjectURL(url);
};

const fileInput = document.getElementById("fileInput");

document.getElementById("importBtn").onclick = () => {
  fileInput.click();
};

fileInput.onchange = () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const json = JSON.parse(reader.result);
      workspace.clear();
      Blockly.serialization.workspaces.load(json, workspace);
      saveWorkspace();
    } catch (e) {
      alert("Fichier invalide.");
    }
  };
  reader.readAsText(file);
  fileInput.value = "";
};

updateMidiStatus();

window.addEventListener("DOMContentLoaded", function () {
  document.getElementById("openBPM-ViwerBtn").onclick = function () {
    window.electronAPI.openTest();
  };
});
